<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinExplain | AI Clinical Assistant & Knowledge Graph Dashboard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#fef2f2',
                            100: '#fee2e2',
                            500: '#ef4444',
                            600: '#dc2626',
                            700: '#b91c1c',
                            900: '#7f1d1d',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Custom White & Red Styles -->
    <style>
        body {
            background-color: #FAFAFA;
            color: #0F172A;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(220, 38, 38, 0.04) 0%, transparent 35%),
                radial-gradient(circle at 90% 90%, rgba(239, 68, 68, 0.04) 0%, transparent 35%);
            background-attachment: fixed;
        }

        /* Glassmorphism Card Style - White & Clean */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        .glass-panel-hover:hover {
            border-color: rgba(220, 38, 38, 0.3);
            box-shadow: 0 12px 30px -5px rgba(220, 38, 38, 0.12);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(241, 245, 249, 0.8);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(220, 38, 38, 0.25);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(220, 38, 38, 0.5);
        }

        /* Pulse Animations */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .pulse-ring {
            animation: pulse-ring 1.8s infinite ease-in-out;
        }
    </style>

    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="font-sans antialiased selection:bg-red-500 selection:text-white min-h-screen flex flex-col">

    <!-- React Root Container -->
    <div id="root" class="flex-1 flex flex-col"></div>

    <!-- React Application Script -->
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // ==========================================
        // 1. HEADER & CONTROL BAR COMPONENT
        // ==========================================
        function Header({ isRecording, isConnected, onStart, onStop, onReset, sessionTag, timerSec }) {
            const formatTime = (totalSec) => {
                const mins = Math.floor(totalSec / 60).toString().padStart(2, '0');
                const secs = (totalSec % 60).toString().padStart(2, '0');
                return `${mins}:${secs}`;
            };

            return (
                <header class="sticky top-0 z-50 glass-panel border-b border-slate-200 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-600 to-rose-600 flex items-center justify-center font-outfit font-extrabold text-2xl text-white shadow-lg shadow-red-500/30">
                            C
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <h1 class="font-outfit font-bold text-xl tracking-tight text-slate-900">ClinExplain</h1>
                                <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-red-50 text-red-600 border border-red-200 uppercase tracking-wider">
                                    Explainable AI Assistant
                                </span>
                            </div>
                            <p class="text-xs text-slate-500">Real-Time Speech Diarization • Knowledge Graph • WHO Guidelines • SOAP Notes</p>
                        </div>
                    </div>

                    <div class="flex items-center gap-3">
                        {/* Live Recording Status Badge */}
                        <div class="flex items-center gap-2.5 px-3.5 py-1.5 rounded-full bg-slate-100 border border-slate-200 text-xs font-medium">
                            <span class={`w-2.5 h-2.5 rounded-full ${
                                isRecording ? 'bg-red-600 pulse-ring shadow-lg shadow-red-500/50' : 
                                isConnected ? 'bg-emerald-500 shadow-md shadow-emerald-500/40' : 'bg-slate-400'
                            }`}></span>
                            <span class="text-slate-700">
                                {isRecording ? `Recording Live (${formatTime(timerSec)})` : isConnected ? 'Ready for Consultation' : 'Idle'}
                            </span>
                        </div>

                        {/* Clear / New Patient Button */}
                        <button 
                            onClick={onReset}
                            title="Clear previous patient data and start fresh session"
                            class="flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl font-semibold text-xs text-slate-700 bg-slate-100 hover:bg-red-50 hover:text-red-700 border border-slate-200 hover:border-red-200 transition-all cursor-pointer"
                        >
                            🔄 New Patient
                        </button>

                        {/* Action Buttons */}
                        {!isRecording ? (
                            <button 
                                onClick={onStart}
                                class="flex items-center gap-2 px-5 py-2.5 rounded-xl font-semibold text-sm text-white bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 shadow-lg shadow-red-500/25 transition-all transform hover:-translate-y-0.5 active:translate-y-0"
                            >
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
                                Start Consultation
                            </button>
                        ) : (
                            <button 
                                onClick={onStop}
                                class="flex items-center gap-2 px-5 py-2.5 rounded-xl font-semibold text-sm text-white bg-slate-900 hover:bg-slate-800 shadow-lg shadow-slate-900/20 transition-all transform hover:-translate-y-0.5 active:translate-y-0"
                            >
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                                Stop Recording
                            </button>
                        )}
                    </div>
                </header>
            );
        }

        // ==========================================
        // 2. CARDIOLOGY RISK BANNER COMPONENT
        // ==========================================
        function CardiologyRiskBanner({ riskAnalysis }) {
            const riskLevel = (riskAnalysis?.risk_level || 'LOW').toUpperCase();
            const riskScore = riskAnalysis?.risk_score || 0.2;
            const flaggedFactors = riskAnalysis?.flagged_factors || [];

            const isHigh = riskLevel === 'HIGH';
            const isMedium = riskLevel === 'MEDIUM';

            const borderStyle = isHigh ? 'border-l-4 border-l-red-600 bg-red-50/70' :
                              isMedium ? 'border-l-4 border-l-amber-500 bg-amber-50/70' :
                              'border-l-4 border-l-emerald-500 bg-emerald-50/70';

            const badgeStyle = isHigh ? 'bg-red-600 text-white shadow-md shadow-red-600/30' :
                               isMedium ? 'bg-amber-500 text-slate-950 font-bold' :
                               'bg-emerald-100 text-emerald-800 border border-emerald-300';

            return (
                <div class={`glass-panel rounded-2xl p-4 transition-all duration-300 ${borderStyle}`}>
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex items-center gap-4">
                            <span class={`font-outfit text-xs font-extrabold px-3.5 py-1.5 rounded-full uppercase tracking-wider ${badgeStyle}`}>
                                {riskLevel} RISK
                            </span>
                            <div>
                                <h3 class="text-sm font-semibold text-slate-900 flex items-center gap-2">
                                    Cardiology Risk Assessment Score: <span class="font-mono text-red-600 font-bold">{riskScore.toFixed(2)}</span>
                                </h3>
                                <p class="text-xs text-slate-500">Automated evaluation against Acute Coronary Syndrome & Red-Flag criteria</p>
                            </div>
                        </div>

                        {/* Flagged Factors Badges */}
                        <div class="flex flex-wrap items-center gap-2">
                            {flaggedFactors.length > 0 ? (
                                flaggedFactors.map((factor, idx) => (
                                    <span key={idx} class="text-xs px-2.5 py-1 rounded-lg bg-red-100 text-red-800 border border-red-200 flex items-center gap-1.5 font-medium">
                                        <span class="w-1.5 h-1.5 rounded-full bg-red-600"></span>
                                        {factor}
                                    </span>
                                ))
                            ) : (
                                <span class="text-xs px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-800 border border-emerald-200 font-medium">
                                    No acute cardiovascular red flags detected
                                </span>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 3. DIARIZED TRANSCRIPT VIEWER COMPONENT
        // ==========================================
        function TranscriptViewer({ turns, partialText, isRecording }) {
            const bottomRef = useRef(null);

            useEffect(() => {
                bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [turns, partialText]);

            return (
                <div class="flex flex-col h-full">
                    <div class="flex-1 overflow-y-auto space-y-4 pr-2 max-h-[520px]">
                        {turns.length === 0 && !partialText ? (
                            <div class="h-full flex flex-col items-center justify-center text-center p-8 text-slate-400">
                                <svg class="w-12 h-12 mb-3 text-red-300 stroke-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 11a7 7 0 0 1-7 7m0 0a7 7 0 0 1-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 0 1-3-3V5a3 3 0 1 1 6 0v6a3 3 0 0 1-3 3z"/></svg>
                                <p class="text-sm font-medium text-slate-700">No conversation recorded yet.</p>
                                <p class="text-xs text-slate-500 mt-1">Click "Start Consultation" to record Doctor & Patient speech.</p>
                            </div>
                        ) : (
                            turns.map((turn, idx) => {
                                const isDoctor = (turn.speaker || '').toUpperCase() === 'DOCTOR';
                                return (
                                    <div key={idx} class={`flex flex-col ${isDoctor ? 'items-end' : 'items-start'} space-y-1`}>
                                        <div class="flex items-center gap-2 px-1">
                                            <span class={`text-[11px] font-bold uppercase ${isDoctor ? 'text-red-600' : 'text-slate-700'}`}>
                                                {isDoctor ? '👨‍⚕️ DOCTOR' : '👤 PATIENT'}
                                            </span>
                                            <span class="text-[10px] text-slate-400 font-mono">
                                                {turn.start != null ? `${turn.start.toFixed(1)}s - ${turn.end.toFixed(1)}s` : ''}
                                            </span>
                                        </div>
                                        <div class={`max-w-[85%] rounded-2xl px-4 py-3 text-sm leading-relaxed ${
                                            isDoctor 
                                                ? 'bg-gradient-to-br from-red-600 to-rose-600 text-white shadow-md shadow-red-500/20 rounded-tr-none' 
                                                : 'bg-slate-100 text-slate-900 border border-slate-200 shadow-sm rounded-tl-none'
                                        }`}>
                                            {turn.text}
                                        </div>
                                    </div>
                                );
                            })
                        )}

                        {/* Streaming Ticker */}
                        {isRecording && (
                            <div class="p-3.5 rounded-xl bg-red-50 border-l-4 border-l-red-600 border border-red-200 text-xs italic text-red-900 animate-pulse">
                                <span class="font-bold font-sans not-italic text-red-700 uppercase tracking-wider text-[10px] block mb-1">Streaming Partial Transcript:</span>
                                "{partialText || 'Listening for speech...'}"
                            </div>
                        )}
                        <div ref={bottomRef} />
                    </div>
                </div>
            );
        }

        // ==========================================
        // 4. INTERACTIVE KNOWLEDGE GRAPH VISUALIZER COMPONENT
        // ==========================================
        function GraphVisualizer({ nodes = [], relationships = [] }) {
            const [selectedCategory, setSelectedCategory] = useState('ALL');
            const [activeNode, setActiveNode] = useState(null);

            // Filter noise tokens & deduplicate nodes by label
            const cleanNodes = useMemo(() => {
                const seen = new Set();
                const result = [];
                const stopWords = new Set(['2', '1', 'fast', 'type', 'medications', 'eerls', 'berry', 'pain']);

                nodes.forEach(node => {
                    const rawText = (node.label || node.text || '').trim();
                    const lowerText = rawText.toLowerCase();
                    
                    if (!rawText || stopWords.has(lowerText) || lowerText.length < 3) return;
                    if (/^\d+$/.test(lowerText)) return;

                    if (!seen.has(lowerText)) {
                        seen.add(lowerText);
                        result.push(node);
                    }
                });
                return result;
            }, [nodes]);

            // Group nodes by category
            const filteredNodes = useMemo(() => {
                if (selectedCategory === 'ALL') return cleanNodes;
                return cleanNodes.filter(n => (n.category || n.label || '').toUpperCase().includes(selectedCategory));
            }, [cleanNodes, selectedCategory]);

            // Layout math for SVG visualization
            const nodePositions = useMemo(() => {
                const positions = {};
                const width = 650;
                const height = 420;
                const centerX = width / 2;
                const centerY = height / 2;

                positions['patient'] = { x: centerX, y: centerY, color: '#DC2626', label: 'Patient', category: 'Patient' };

                const total = filteredNodes.length;
                filteredNodes.forEach((node, idx) => {
                    const angle = (idx / Math.max(1, total)) * 2 * Math.PI;
                    const radius = 135 + (idx % 2) * 45;
                    const x = centerX + radius * Math.cos(angle);
                    const y = centerY + radius * Math.sin(angle);

                    const isAbsent = node.status === 'absent' || node.negated;
                    let color = isAbsent ? '#94A3B8' : '#DC2626'; // Slate gray for Ruled Out / Absent
                    const cat = (node.category || node.label || '').toUpperCase();
                    if (!isAbsent) {
                        if (cat.includes('SYMPTOM') || cat.includes('SIGN')) color = '#DC2626';
                        if (cat.includes('DISEASE')) color = '#9333EA';
                        if (cat.includes('MEDICATION')) color = '#10B981';
                        if (cat.includes('DURATION') || cat.includes('SEVERITY')) color = '#F59E0B';
                    }

                    positions[node.id || `node_${idx}`] = {
                        ...node,
                        x,
                        y,
                        color,
                        isAbsent,
                        label: node.label || node.text || 'Entity'
                    };
                });

                return positions;
            }, [filteredNodes]);

            return (
                <div class="flex flex-col h-full space-y-4">
                    {/* Category Filter Pills & Visual Legend */}
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <div class="flex flex-wrap items-center gap-2">
                            {['ALL', 'SYMPTOM', 'DISEASE', 'MEDICATION', 'DURATION'].map(cat => (
                                <button
                                    key={cat}
                                    onClick={() => setSelectedCategory(cat)}
                                    class={`text-xs px-3 py-1 rounded-lg font-medium transition-all ${
                                        selectedCategory === cat 
                                            ? 'bg-red-600 text-white font-bold shadow-md shadow-red-500/30' 
                                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200'
                                    }`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>

                        {/* Node Color Legend */}
                        <div class="flex items-center gap-3 text-[11px] text-slate-600 font-medium">
                            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-red-600"></span> Active Symptom</span>
                            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-purple-600"></span> Disease</span>
                            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span> Medication</span>
                            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> Duration</span>
                            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span> Ruled Out / Absent</span>
                        </div>
                    </div>

                    {/* SVG Interactive Graph Canvas */}
                    <div class="relative flex-1 bg-slate-50 rounded-2xl border border-slate-200 overflow-hidden min-h-[380px] flex items-center justify-center">
                        {Object.keys(nodePositions).length <= 1 ? (
                            <div class="text-center p-6 text-slate-400">
                                <p class="text-sm font-medium text-slate-600">Knowledge Graph Canvas</p>
                                <p class="text-xs text-slate-400 mt-1">Patient entity network will appear here dynamically as speech is processed.</p>
                            </div>
                        ) : (
                            <svg class="w-full h-full max-h-[440px]" viewBox="0 0 650 420">
                                {/* Connect Edges to Center Patient Node */}
                                {Object.entries(nodePositions).map(([id, pos]) => {
                                    if (id === 'patient') return null;
                                    const center = nodePositions['patient'];
                                    return (
                                        <g key={`edge_${id}`}>
                                            <line 
                                                x1={center.x} 
                                                y1={center.y} 
                                                x2={pos.x} 
                                                y2={pos.y} 
                                                stroke={pos.color} 
                                                stroke-width="1.8" 
                                                stroke-opacity={pos.isAbsent ? "0.2" : "0.5"}
                                                stroke-dasharray={pos.isAbsent ? "2,2" : "4"}
                                            />
                                        </g>
                                    );
                                })}

                                {/* Render Interactive Nodes */}
                                {Object.entries(nodePositions).map(([id, pos]) => (
                                    <g 
                                        key={id} 
                                        transform={`translate(${pos.x}, ${pos.y})`}
                                        onClick={() => setActiveNode(pos)}
                                        class="cursor-pointer group"
                                    >
                                        <circle 
                                            r={id === 'patient' ? 22 : 16} 
                                            fill={pos.color} 
                                            fill-opacity={pos.isAbsent ? "0.1" : "0.2"} 
                                            stroke={pos.color} 
                                            stroke-width="2" 
                                            stroke-dasharray={pos.isAbsent ? "3,3" : "none"}
                                            class="transition-all duration-300 group-hover:scale-125"
                                        />
                                        <circle 
                                            r={id === 'patient' ? 8 : 6} 
                                            fill={pos.color} 
                                        />
                                        <text 
                                            y={id === 'patient' ? 36 : 28} 
                                            text-anchor="middle" 
                                            fill={pos.isAbsent ? "#64748B" : "#0F172A"} 
                                            font-size="11" 
                                            font-weight={pos.isAbsent ? "500" : "600"}
                                            class="drop-shadow-sm select-none"
                                        >
                                            {pos.label} {pos.isAbsent ? '(Ruled Out)' : ''}
                                        </text>
                                    </g>
                                ))}
                            </svg>
                        )}

                        {/* Selected Node Inspector Drawer */}
                        {activeNode && (
                            <div class="absolute bottom-3 right-3 glass-panel p-4 rounded-xl border border-red-200 text-xs max-w-xs space-y-1 shadow-xl animate-fadeIn">
                                <div class="flex justify-between items-center pb-1">
                                    <span class="font-bold text-red-600">{activeNode.label}</span>
                                    <button onClick={() => setActiveNode(null)} class="text-slate-400 hover:text-slate-700">✕</button>
                                </div>
                                <div class="text-slate-600">Category: <span class="font-mono text-slate-900 font-medium">{activeNode.category || 'N/A'}</span></div>
                                <div class="text-slate-600">Status: <span class="font-mono text-emerald-600 font-semibold">{activeNode.status || 'present'}</span></div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ==========================================
        // 5. AUTO-STRUCTURED SOAP NOTE VIEWER COMPONENT
        // ==========================================
        function SOAPViewer({ transcript, entities = [], riskAnalysis, missingInfo = [], ragResult }) {
            const [copied, setCopied] = useState(false);

            const presentSymptoms = useMemo(() => 
                entities.filter(e => !e.negated && (e.label || e.category || '').toLowerCase().includes('symptom')),
            [entities]);

            const medications = useMemo(() => 
                entities.filter(e => !e.negated && e.status !== 'absent' && (e.label || e.category || '').toLowerCase().includes('medication')),
            [entities]);

            const copySOAP = () => {
                const text = `
=== CLINEXPLAIN SOAP NOTE ===
SUBJECTIVE:
- Chief Symptoms: ${presentSymptoms.map(s => s.text).join(', ') || 'None reported'}
- Patient Transcript: ${transcript || 'N/A'}

OBJECTIVE:
- Medications Mentioned: ${medications.map(m => m.text).join(', ') || 'None'}
- Clinical Facts Extracted: ${entities.length} total entities

ASSESSMENT:
- Cardiology Risk Level: ${riskAnalysis?.risk_level || 'LOW'} (Score: ${riskAnalysis?.risk_score || 0.2})
- Risk Factors: ${riskAnalysis?.flagged_factors?.join('; ') || 'None'}

PLAN & GUIDELINE RAG:
- Suggested Clinical Questions: ${missingInfo.flatMap(m => m.suggested_questions || []).join('; ') || 'Standard follow-up'}
- RAG Guideline Evidence: ${ragResult?.llm_explanation || 'N/A'}
- BP Threshold Facts: ${ragResult?.bp_conditions?.join(', ') || 'N/A'}
- Timing Window: ${ragResult?.timing_facts?.join('; ') || 'N/A'}
- Claim Faithfulness: ${ragResult?.validation_scores?.faithfulness?.toFixed(1) || 100}%
                `.trim();
                navigator.clipboard.writeText(text);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            return (
                <div class="flex flex-col h-full space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-semibold text-slate-500">Structured Clinical Consultation Note (with WHO RAG Evidence)</span>
                        <button 
                            onClick={copySOAP}
                            class="text-xs font-medium px-3 py-1.5 rounded-lg bg-red-50 text-red-700 border border-red-200 hover:bg-red-100 transition-all font-semibold"
                        >
                            {copied ? '✓ Copied to Clipboard' : '📋 Copy SOAP Note'}
                        </button>
                    </div>

                    {/* 4-Quadrant SOAP Cards */}
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1 overflow-y-auto max-h-[500px] pr-1">
                        {/* Subjective Card */}
                        <div class="glass-panel p-4 rounded-xl border-l-4 border-l-red-600 space-y-2">
                            <h4 class="font-outfit text-xs font-bold text-red-600 uppercase tracking-wider">S - Subjective</h4>
                            <p class="text-xs text-slate-700 leading-relaxed">
                                <strong class="text-slate-900">Symptoms Reported:</strong> {presentSymptoms.map(s => s.text).join(', ') || 'No active symptoms detected yet.'}
                            </p>
                            <p class="text-xs text-slate-500 line-clamp-3 italic">
                                "{transcript || 'Awaiting live patient conversation...'}"
                            </p>
                        </div>

                        {/* Objective Card */}
                        <div class="glass-panel p-4 rounded-xl border-l-4 border-l-slate-700 space-y-2">
                            <h4 class="font-outfit text-xs font-bold text-slate-700 uppercase tracking-wider">O - Objective</h4>
                            <p class="text-xs text-slate-700">

        // ==========================================
        // 6. CLINICAL EVIDENCE & CLAIM VALIDATOR VIEWER
        // ==========================================
        function EvidenceViewer({ entities = [], candidateDiseases = [], ragResult, onRunRAGQuery, isQueryingRAG }) {
            const [viewMode, setViewMode] = useState('entities'); // 'entities', 'chunks', 'claims'
            const [customQuery, setCustomQuery] = useState('');
            const dynamicPrompts = useMemo(() => {
                if (ragResult?.dynamic_prompts && ragResult.dynamic_prompts.length > 0) {
                    return ragResult.dynamic_prompts;
                }
                if (entities && entities.length > 0) {
                    const text = entities.map(e => (e.text || '').toLowerCase()).join(' ');
                    const list = [];
                    if (text.includes('chest') || text.includes('pain') || text.includes('angina')) {
                        list.push("Chest pain & exertional angina guidelines");
                    }
                    if (text.includes('hypertension') || text.includes('pressure') || text.includes('140') || text.includes('blood')) {
                        list.push("WHO hypertension treatment start guidelines");
                    }
                    if (text.includes('160') || text.includes('severe') || text.includes('stairs') || text.includes('urgent')) {
                        list.push("SBP >= 160 urgent treatment protocol");
                    }
                    if (text.includes('diabetes')) {
                        list.push("Hypertension treatment thresholds with diabetes");
                    }
                    if (text.includes('aspirin')) {
                        list.push("Antiplatelet & Aspirin clinical guidelines");
                    }
                    if (text.includes('penicillin') || text.includes('allergy')) {
                        list.push("Medication allergy & alternative drug protocols");
                    }
                    if (list.length > 0) return list.slice(0, 4);
                }
                return [
                    "Hypertension treatment start guidelines",
                    "SBP >= 160 urgent treatment protocol",
                    "Chest pain & exertional angina guidelines"
                ];
            }, [entities, ragResult]);

            const isPatientSpecific = entities && entities.length > 0;

            const handleQuerySubmit = (e) => {
                e.preventDefault();
                if (customQuery.trim() && onRunRAGQuery) {
                    onRunRAGQuery(customQuery, entities);
                }
            };

            return (
                <div class="flex flex-col h-full space-y-4">
                    {/* Top RAG Query Bar & Quick Chips */}
                    <form onSubmit={handleQuerySubmit} class="flex flex-col gap-2 glass-panel p-3 rounded-xl border border-red-200">
                        <div class="flex items-center gap-2">
                            <input
                                type="text"
                                value={customQuery}
                                onChange={(e) => setCustomQuery(e.target.value)}
                                placeholder="Query medical guidelines (e.g. When should treatment start for SBP >= 160?)"
                                class="flex-1 bg-slate-50 text-xs text-slate-900 px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:border-red-600 placeholder:text-slate-400"
                            />
                            <button
                                type="submit"
                                disabled={isQueryingRAG}
                                class="px-4 py-2 rounded-lg bg-gradient-to-r from-red-600 to-rose-600 text-xs font-semibold text-white hover:from-red-500 hover:to-rose-500 shadow-md shadow-red-500/20 disabled:opacity-50"
                            >
                                {isQueryingRAG ? 'Searching...' : '🔍 Query RAG'}
                            </button>
                        </div>

                        {/* One-Click Dynamic Quick Prompts */}
                        <div class="flex flex-wrap items-center gap-1.5 pt-1 text-[11px]">
                            <span class="text-slate-600 font-semibold flex items-center gap-1">
                                {isPatientSpecific ? '✨ Patient-Tailored Prompts:' : 'Quick Prompts:'}
                            </span>
                            {dynamicPrompts.map((prompt, pIdx) => (
                                <button
                                    key={pIdx}
                                    type="button"
                                    onClick={() => { setCustomQuery(prompt); onRunRAGQuery && onRunRAGQuery(prompt, entities); }}
                                    class={`px-2.5 py-1 rounded-md border transition-all font-medium cursor-pointer ${
                                        isPatientSpecific 
                                            ? 'bg-red-600 text-white border-red-700 hover:bg-red-700 shadow-sm shadow-red-500/20' 
                                            : 'bg-red-50 text-red-700 border-red-200 hover:bg-red-100'
                                    }`}
                                >
                                    💡 {prompt}
                                </button>
                            ))}
                        </div>
                    </form>

                    {/* View Switcher Pills */}
                    <div class="flex items-center justify-between text-xs">
                        <div class="flex items-center gap-2">
                            <button
                                onClick={() => setViewMode('entities')}
                                class={`px-3 py-1.5 rounded-lg font-medium transition-all ${
                                    viewMode === 'entities' ? 'bg-red-600 text-white font-bold' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                }`}
                            >
                                🧪 Entity Spans ({entities.length})
                            </button>
                            <button
                                onClick={() => setViewMode('chunks')}
                                class={`px-3 py-1.5 rounded-lg font-medium transition-all ${
                                    viewMode === 'chunks' ? 'bg-red-600 text-white font-bold' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                }`}
                            >
                                📚 FAISS Chunks ({ragResult?.retrieved_chunks?.length || 0})
                            </button>
                            <button
                                onClick={() => setViewMode('claims')}
                                class={`px-3 py-1.5 rounded-lg font-medium transition-all ${
                                    viewMode === 'claims' ? 'bg-red-600 text-white font-bold' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                }`}
                            >
                                🛡️ Claim Validation ({ragResult?.validation_results?.length || 0})
                            </button>
                        </div>

                        {ragResult?.validation_scores && (
                            <div class="text-xs font-mono text-emerald-700 font-semibold flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                Faithfulness: {ragResult.validation_scores.faithfulness.toFixed(1)}%
                            </div>
                        )}
                    </div>

                    {/* Mode 1: Medical Entities Table */}
                    {viewMode === 'entities' && (
                        <div class="overflow-x-auto flex-1 max-h-[420px]">
                            <table class="w-full text-left text-xs text-slate-700">
                                <thead class="text-[11px] uppercase bg-slate-100 text-slate-600 sticky top-0 border-b border-slate-200">
                                    <tr>
                                        <th class="p-3">Entity Text</th>
                                        <th class="p-3">Category</th>
                                        <th class="p-3">Span Offset</th>
                                        <th class="p-3">Assertion</th>
                                        <th class="p-3">Source</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    {entities.length === 0 ? (
                                        <tr>
                                            <td colSpan="5" class="p-8 text-center text-slate-400">No clinical evidence extracted yet. Run live consultation or query RAG above.</td>
                                        </tr>
                                    ) : (
                                        entities.map((e, idx) => (
                                            <tr key={idx} class="hover:bg-slate-50 transition-colors">
                                                <td class="p-3 font-semibold text-slate-900">{e.text}</td>
                                                <td class="p-3">
                                                    <span class="px-2 py-0.5 rounded bg-red-50 text-red-700 border border-red-200 font-mono text-[11px] font-semibold">
                                                        {e.label || e.category}
                                                    </span>
                                                </td>
                                                <td class="p-3 font-mono text-slate-500">[{e.start}, {e.end}]</td>
                                                <td class="p-3">
                                                    <span class={`px-2 py-0.5 rounded font-bold text-[10px] uppercase ${
                                                        e.negated || e.status === 'absent' 
                                                            ? 'bg-red-100 text-red-800 border border-red-200' 
                                                            : 'bg-emerald-100 text-emerald-800 border border-emerald-200'
                                                    }`}>
                                                        {e.negated ? 'Absent' : 'Present'}
                                                    </span>
                                                </td>
                                                <td class="p-3 text-slate-500 font-mono">{e.source || 'BioBERT Model'}</td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {/* Mode 2: FAISS Chunks List */}
                    {viewMode === 'chunks' && (
                        <div class="space-y-3 flex-1 overflow-y-auto max-h-[420px] pr-1">
                            {!ragResult?.retrieved_chunks || ragResult.retrieved_chunks.length === 0 ? (
                                <div class="text-center p-8 text-slate-400 text-xs">No vector chunks loaded. Enter a guideline question above to retrieve FAISS evidence.</div>
                            ) : (
                                ragResult.retrieved_chunks.map((chunk, idx) => (
                                    <div key={idx} class="glass-panel p-3.5 rounded-xl space-y-1.5 border border-slate-200 text-xs">
                                        <div class="flex justify-between items-center text-[11px] font-mono text-slate-500">
                                            <span class="font-bold text-red-600">Rank #{chunk.rank} — Chunk ID: {chunk.chunk_id}</span>
                                            <span>Distance: {chunk.distance.toFixed(4)}</span>
                                        </div>
                                        <div class="text-slate-800 leading-relaxed font-sans">{chunk.content}</div>
                                    </div>
                                ))
                            )}
                        </div>
                    )}

                    {/* Mode 3: Claim Validation Table */}
                    {viewMode === 'claims' && (
                        <div class="space-y-3 flex-1 overflow-y-auto max-h-[420px] pr-1">
                            {!ragResult?.validation_results || ragResult.validation_results.length === 0 ? (
                                <div class="text-center p-8 text-slate-400 text-xs">No claims validated yet. Enter a guideline prompt to execute claim-level verification.</div>
                            ) : (
                                <div class="space-y-2">
                                    {/* Faithfulness Summary Metric */}
                                    <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-200">
                                        <div>
                                            <div class="text-xs font-semibold text-slate-900">Claim-Level Faithfulness Score</div>
                                            <div class="text-[11px] text-slate-500">
                                                Supported: {ragResult.validation_scores.supported} | Partial: {ragResult.validation_scores.partial} | Unsupported: {ragResult.validation_scores.unsupported}
                                            </div>
                                        </div>
                                        <div class="text-lg font-mono font-bold text-red-600">
                                            {ragResult.validation_scores.faithfulness.toFixed(1)}%
                                        </div>
                                    </div>

                                    {/* Claims Table */}
                                    <table class="w-full text-left text-xs text-slate-700">
                                        <thead class="text-[11px] uppercase bg-slate-100 text-slate-600 sticky top-0 border-b border-slate-200">
                                            <tr>
                                                <th class="p-3">Extracted Claim</th>
                                                <th class="p-3">Claim Type</th>
                                                <th class="p-3">Validation Status</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-slate-100">
                                            {ragResult.validation_results.map((c, i) => (
                                                <tr key={i} class="hover:bg-slate-50 transition-colors">
                                                    <td class="p-3 text-slate-900 font-medium">{c.claim}</td>
                                                    <td class="p-3 font-mono text-red-700 text-[11px] font-semibold">{c.type}</td>
                                                    <td class="p-3">
                                                        <span class={`px-2 py-0.5 rounded font-bold text-[10px] uppercase ${
                                                            c.status === 'SUPPORTED' ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' :
                                                            c.status === 'PARTIALLY SUPPORTED' ? 'bg-amber-100 text-amber-800 border border-amber-200' :
                                                            'bg-red-100 text-red-800 border border-red-200'
                                                        }`}>
                                                            {c.status === 'SUPPORTED' ? '✓ Supported' : c.status === 'PARTIALLY SUPPORTED' ? '⚠️ Partial' : '✗ Unsupported'}
                                                        </span>
                                                    </td>
                                                </tr>

                                    </table>

                            )}

                    )}
                </div>
            );
        }

        // ==========================================
        // 7. MAIN REACT APP DASHBOARD COMPONENT
        // ==========================================
        function App() {
            const [isRecording, setIsRecording] = useState(false);
            const [isConnected, setIsConnected] = useState(false);
            const [sessionTag, setSessionTag] = useState('');
            const [timerSec, setTimerSec] = useState(0);

            const [activeTab, setActiveTab] = useState('transcript'); // 'transcript', 'graph', 'soap', 'evidence'

            const [fullTranscript, setFullTranscript] = useState('');
            const [turns, setTurns] = useState([]);
            const [partialText, setPartialText] = useState('');
            const [entities, setEntities] = useState([]);
            const [missingInfo, setMissingInfo] = useState([]);
            const [riskAnalysis, setRiskAnalysis] = useState(null);
            const [candidateDiseases, setCandidateDiseases] = useState([]);
            const [graphNodes, setGraphNodes] = useState([]);
            const [graphRelationships, setGraphRelationships] = useState([]);

            // RAG Guideline Evidence & Claim Validation State
            const [ragResult, setRagResult] = useState(null);
            const [isQueryingRAG, setIsQueryingRAG] = useState(false);

            const socketRef = useRef(null);
            const recorderRef = useRef(null);
            const streamRef = useRef(null);
            const timerRef = useRef(null);

            // RAG Guideline API Query Handler
            const runRAGQuery = async (queryText, activeEntities = null) => {
                try {
                    setIsQueryingRAG(true);
                    const res = await fetch("/api/rag/query", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ 
                            question: queryText, 
                            top_k: 5,
                            entities: activeEntities || entities,
                            risk_analysis: riskAnalysis
                        }),
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setRagResult(data);
                    }
                } catch (err) {
                    console.error("RAG query failed:", err);
                } finally {
                    setIsQueryingRAG(false);
                }
            };

            // Timer Tick
            useEffect(() => {
                if (isRecording) {
                    timerRef.current = setInterval(() => setTimerSec(s => s + 1), 1000);
                } else {
                    clearInterval(timerRef.current);
                }
                return () => clearInterval(timerRef.current);
            }, [isRecording]);

            const stopMicrophone = () => {
                if (streamRef.current) {
                    streamRef.current.getTracks().forEach(t => t.stop());
                    streamRef.current = null;
                }
            };

            const startConsultation = async () => {
                try {
                    setTimerSec(0);
                    setPartialText('');
                    streamRef.current = await navigator.mediaDevices.getUserMedia({ audio: true });

                    const ws = new WebSocket("ws://127.0.0.1:8000/speech/live");
                    socketRef.current = ws;

                    ws.onopen = () => {
                        setIsConnected(true);
                        setIsRecording(true);

                        const options = {};
                        if (MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) {
                            options.mimeType = "audio/webm;codecs=opus";
                        }
                        const rec = new MediaRecorder(streamRef.current, options);
                        recorderRef.current = rec;

                        rec.ondataavailable = (event) => {
                            if (event.data.size > 0 && ws.readyState === WebSocket.OPEN) {
                                ws.send(event.data);
                            }
                        };

                        rec.onstop = () => {
                            if (ws.readyState === WebSocket.OPEN) {
                                ws.send("stop");
                            }
                            stopMicrophone();
                        };

                        rec.start(1000);
                    };

                    ws.onmessage = (event) => {
                        try {
                            const res = JSON.parse(event.data);
                            if (res.event === 'connected') {
                                setSessionTag('Session: ' + res.session_id.substring(0, 8));
                            } else if (res.event === 'partial_transcript') {
                                setPartialText(res.transcript || '');
                                setFullTranscript(res.transcript || '');
                                if (res.missing_information) setMissingInfo(res.missing_information);
                                if (res.risk_analysis) setRiskAnalysis(res.risk_analysis);
                                if (res.medical_nlp?.entities) setEntities(res.medical_nlp.entities);
                                if (res.candidate_diseases) setCandidateDiseases(res.candidate_diseases);
                                if (res.graph_nodes) setGraphNodes(res.graph_nodes);
                                if (res.graph_relationships) setGraphRelationships(res.graph_relationships);
                            } else if (res.event === 'completed') {
                                setIsRecording(false);
                                setPartialText('');
                                if (res.result?.transcript) setFullTranscript(res.result.transcript);
                                if (res.result?.conversation) setTurns(res.result.conversation);
                                if (res.result?.medical_nlp?.entities) setEntities(res.result.medical_nlp.entities);
                                if (res.result?.rag_result) setRagResult(res.result.rag_result);
                            }
                        } catch (err) {
                            console.error("Message parse error:", err);
                        }
                    };

                    ws.onclose = () => {
                        setIsConnected(false);
                        setIsRecording(false);
                        stopMicrophone();
                    };

                } catch (err) {
                    alert("Audio device access error: " + err.message);
                }
            };

            // Auto-cleanup on browser reload/tab close
            useEffect(() => {
                const handleBeforeUnload = () => {
                    if (socketRef.current) {
                        try {
                            socketRef.current.send("stop");
                            socketRef.current.close();
                        } catch (e) {}
                    }
                    fetch("/speech/reset", { method: "POST", keepalive: true }).catch(() => {});
                };
                window.addEventListener('beforeunload', handleBeforeUnload);
                return () => window.removeEventListener('beforeunload', handleBeforeUnload);
            }, []);

            const stopConsultation = () => {
                setIsRecording(false);
                if (recorderRef.current && recorderRef.current.state !== 'inactive') {
                    recorderRef.current.stop();
                }
            };

            const resetConsultation = async () => {
                if (isRecording) {
                    setIsRecording(false);
                    stopMicrophone();
                }
                if (socketRef.current) {
                    try {
                        socketRef.current.send("stop");
                        socketRef.current.close();
                    } catch (e) {}
                    socketRef.current = null;
                }
                try {
                    await fetch("/speech/reset", { method: "POST" });
                } catch (e) {}

                setTurns([]);
                setPartialText('');
                setFullTranscript('');
                setEntities([]);
                setMissingInfo([]);
                setRiskAnalysis(null);
                setCandidateDiseases([]);
                setGraphNodes([]);
                setGraphRelationships([]);
                setRagResult(null);
                setTimerSec(0);
                setSessionTag('');
                setIsConnected(false);
            };

            return (
                <div class="flex-1 flex flex-col">
                    <Header 
                        isRecording={isRecording}
                        isConnected={isConnected}
                        onStart={startConsultation}
                        onStop={stopConsultation}
                        onReset={resetConsultation}
                        sessionTag={sessionTag}
                        timerSec={timerSec}
                    />

                    <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-[1800px] w-full mx-auto">
                        
                        {/* Top Cardiology Risk Banner */}
                        <div class="lg:col-span-12">
                            <CardiologyRiskBanner riskAnalysis={riskAnalysis} />
                        </div>

                        {/* Left Column: Live Audio Speech & Dialogue Transcript (5 cols) */}
                        <div class="lg:col-span-5 flex flex-col space-y-4">
                            <div class="glass-panel rounded-2xl p-5 flex-1 flex flex-col">
                                <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-200">
                                    <h2 class="font-outfit font-bold text-base text-slate-900 flex items-center gap-2">
                                        <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                                        Live Speech Transcript
                                    </h2>
                                    <span class="text-xs text-slate-500 font-mono">Diarization Active</span>
                                </div>

                                <TranscriptViewer 
                                    turns={turns}
                                    partialText={partialText}
                                    isRecording={isRecording}
                                />
                            </div>
                        </div>

                        {/* Right Column: React View Tabs & AI Assistants (7 cols) */}
                        <div class="lg:col-span-7 flex flex-col space-y-4">
                            
                            {/* Guideline Follow-Up Questions (Live Missing Info) */}
                            <div class="glass-panel p-5 rounded-2xl border-amber-300 bg-amber-50/50">
                                <div class="flex justify-between items-center mb-3">
                                    <h3 class="font-outfit font-bold text-sm text-amber-900 flex items-center gap-2">
                                        <svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                                        Suggested Follow-Up Questions
                                    </h3>
                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-200 text-amber-900 uppercase border border-amber-300">ACC/AHA Guidelines</span>
                                </div>
                                
                                <div class="space-y-2 max-h-40 overflow-y-auto">
                                    {missingInfo.flatMap(m => m.suggested_questions || []).length === 0 ? (
                                        <p class="text-xs text-slate-500 italic text-center py-2">Follow-up questions will be generated live as symptoms are spoken.</p>
                                    ) : (
                                        missingInfo.flatMap(m => m.suggested_questions || []).map((q, idx) => (
                                            <div key={idx} class="flex items-start gap-3 p-2.5 rounded-lg bg-white border border-slate-200 shadow-sm hover:border-amber-400 transition-all">
                                                <input type="checkbox" id={`q_${idx}`} class="mt-0.5 accent-red-600 w-4 h-4 cursor-pointer" />
                                                <label htmlFor={`q_${idx}`} class="text-xs text-slate-800 cursor-pointer">{q}</label>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>

                            {/* View Tab Navigation Bar */}
                            <div class="glass-panel p-1.5 rounded-xl flex items-center gap-2 bg-slate-100 border-slate-200">
                                {[
                                    { id: 'graph', label: '🕸️ Knowledge Graph' },
                                    { id: 'soap', label: '📋 SOAP Note' },
                                    { id: 'evidence', label: '🔍 Evidence & Claims' },
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        class={`flex-1 text-xs font-semibold py-2.5 rounded-lg transition-all ${
                                            activeTab === tab.id 
                                                ? 'bg-gradient-to-r from-red-600 to-rose-600 text-white shadow-md shadow-red-500/25' 
                                                : 'text-slate-600 hover:text-slate-900 hover:bg-white'
                                        }`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </div>

                            {/* Tab Content Panels */}
                            <div class="glass-panel p-5 rounded-2xl flex-1 flex flex-col min-h-[420px]">
                                {activeTab === 'graph' && (
                                    <GraphVisualizer nodes={graphNodes.length > 0 ? graphNodes : entities} relationships={graphRelationships} />
                                )}
                                {activeTab === 'soap' && (
                                    <SOAPViewer 
                                        transcript={turns.length > 0 ? turns.map(t => t.text).join(' ') : fullTranscript}
                                        entities={entities}
                                        riskAnalysis={riskAnalysis}
                                        missingInfo={missingInfo}
                                        ragResult={ragResult}
                                    />
                                )}
                                {activeTab === 'evidence' && (
                                    <EvidenceViewer 
                                        entities={entities} 
                                        candidateDiseases={candidateDiseases}
                                        ragResult={ragResult}
                                        onRunRAGQuery={runRAGQuery}
                                        isQueryingRAG={isQueryingRAG}
                                    />
                                )}
                            </div>

                        </div>
                    </main>
                </div>
            );
        }

        // Render React App
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
